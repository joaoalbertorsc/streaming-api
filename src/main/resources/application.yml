spring:
  config:
    # Local settings (DB credentials, JWT secret) live in .env at the project root; real
    # environment variables take precedence over it.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streaming}
    username: ${DB_USERNAME:streaming}
    password: ${DB_PASSWORD:streaming}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgres

app:
  jwt:
    # No default on purpose: the app must not start with a secret committed to the repo.
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  pin:
    min-length: 4
    max-length: 6
