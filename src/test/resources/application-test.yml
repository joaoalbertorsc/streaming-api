spring:
  datasource:
    url: jdbc:h2:mem:streaming_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testmigration

app:
  jwt:
    secret: "TEST_SECRET_TEST_SECRET_TEST_SECRET_32B"
    expiration-minutes: 60
  pin:
    min-length: 4
    max-length: 6