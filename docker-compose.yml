services:
  postgres:
    image: postgres:16
    container_name: streaming-postgres
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: ${DB_USERNAME:-streaming}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-streaming}
    ports:
      - "5432:5432"
    volumes:
      - streaming-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  streaming-pgdata:
